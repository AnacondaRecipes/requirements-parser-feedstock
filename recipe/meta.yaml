{% set name = "requirements-parser" %}
{% set version = "0.13.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 78811383b2089b6c5197a1431bc2c12ff950245edca39a23eea3460782038dd3

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python
    - pip
    - poetry-core >=1.0.0
  run:
    - python
    - packaging >=23.2

test:
  source_files:
    - tests
  imports:
    - requirements
    - requirements.requirement
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/madpah/requirements-parser
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: This is a small Python module for parsing Pip requirement files.
  description: |
    This is a small Python module for parsing Pip requirement files.
    The goal is to parse everything in the Pip requirement file format spec.
  doc_url: https://requirements-parser.readthedocs.io
  dev_url: https://github.com/madpah/requirements-parser

extra:
  recipe-maintainers:
    - CurtLH
